  <g transform="translate(807 376) rotate(-15)" filter="url(#shadow)"><circle r="66" fill="#bfd99e"/><circle r="45" fill="#163f32"/><path d="M-20 0l14 14 28-30" fill="none" stroke="#d7e9bd" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g>
  <circle cx="555" cy="143" r="5" fill="#c7dfb0"/><path d="M932 480v24m-12-12h24" stroke="#c7dfb0" stroke-width="2"/>
